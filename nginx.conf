# Nginx config for WMS
# Place at: /etc/nginx/sites-available/wms
# Enable:   sudo ln -sf /etc/nginx/sites-available/wms /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx

# HTTP — redirect ke HTTPS (setelah certbot jalan)
server {
    listen 80;
    server_name wms.otakweb.com;

    # Certbot validation path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name wms.otakweb.com;

    # Certbot SSL (auto-generated setelah certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/wms.otakweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.otakweb.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/javascript/wms/apps/web/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets — cache 1 year (fingerprinted by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy + uploaded images
    location /api/ {
        proxy_pass http://127.0.0.1:3034;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3034;
    }

    # SPA fallback — semua route Vue dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Upload size limit
    client_max_body_size 5M;
}
